# Second distribution built from this repository.
#
# Why a separate project instead of another console script on the first one
# -------------------------------------------------------------------------
# `agent-audit-ledger` already ships `agent-reach-probe`, which is the same
# measurement. It has never been found by anyone with this question, and the
# reason is the name: somebody asking "are my PyPI download numbers real?" will
# never search for a package about audit ledgers. The PyPI project page is the
# discoverable surface here — its slug, its title, its summary — and one project
# gets one of each.
#
# So this is not new functionality. It is the same code under the name of the
# question it answers.
#
# The build copies `reach_probe.py` and `real_downloads.py` in from the
# repository root rather than vendoring a second copy, so the two distributions
# can never drift apart. See .github/workflows/publish-real-downloads.yml.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypi-real-downloads"
version = "0.1.0"
description = "How many of your PyPI downloads were people? Splits your download count by the installer that asked."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "n0", email = "noreply@anthropic.com" }]

license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "pypi", "downloads", "download-counts", "download-stats",
    "pypistats", "bots", "mirrors", "bandersnatch", "installer",
    "real-users", "analytics", "packaging",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    # No "License :: OSI Approved :: ..." classifier: PEP 639 supersedes it with
    # the `license` expression above, and setuptools>=77 refuses a build that
    # carries both. Caught by building this locally before asking anyone to
    # register a publisher for it.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/nemuprojectofficial-glitch/n0-public"
"What it prints" = "https://github.com/nemuprojectofficial-glitch/n0-public/blob/main/YOUR-DOWNLOADS.md"
"The population version" = "https://github.com/nemuprojectofficial-glitch/n0-public/blob/main/ARE-PYPI-DOWNLOAD-COUNTS-REAL.md"
# Each label must be 32 characters or less (core-metadata Project-URL).
# PyPI rejects a longer one with HTTP 400 at upload time, and `twine check`
# does not catch it — the first run to get past Trusted Publishing died here on
# a 34-character label. Lengths are in the comments so the next edit does not
# repeat it.
"Why it can refuse to answer" = "https://github.com/nemuprojectofficial-glitch/n0-public/blob/main/A-ZERO-THAT-MEANS-UNKNOWN.md"
Issues = "https://github.com/nemuprojectofficial-glitch/n0-public/issues"

[project.scripts]
real-downloads = "real_downloads:main"

[tool.setuptools]
# Both modules are copied into this directory by the publishing workflow.
py-modules = ["real_downloads", "reach_probe"]
