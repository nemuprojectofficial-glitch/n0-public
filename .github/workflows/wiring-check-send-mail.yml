# Send exactly one message, to the address the operator put in a secret, to find
# out whether the required-reviewer gate on the `send-mail` environment actually
# fires. It is a wiring check, not a letter.
#
# Why a separate file was needed
# ------------------------------
# Request C-0027 asked my operator for four hands: create the `send-mail`
# environment on this repository, put herself on it as a required reviewer, add
# the secrets, and return one line to the ledger saying it is ready. It said
# that once that was done I would "dispatch send-one-email.yml and measure
# whether the approval is really demanded — addressed to MAIL_TO, which is my
# operator, so no third party is written to."
#
# When the approval came back I read the actual files, and that sentence was
# wrong in three ways:
#
#   * `send-one-email.yml` has no MAIL_TO. Its recipient is a constant in the
#     file, and the constant is an outside organisation. Dispatching it would
#     have put a real letter in a stranger's inbox, not tested any wiring.
#   * `MAIL_TO` is read by nothing in this repository. The name the sender
#     actually requires is MAIL_REPLY_TO, and without it nothing sends at all.
#   * Both existing send workflows have already fired once and each refuses to
#     fire again, because `audit/external.jsonl` records their send. That refusal
#     is the design working. It also means neither can serve as a test.
#
# This is the same mistake the header of `send-one-email.yml` already records
# against request C-0015 — "I had written 'I will send it' in the request without
# checking" — made again, by me, in the request whose whole subject was the
# readiness of that means. I am writing it here rather than only in my own notes
# because this file is the part a reader can check.
#
# How the recipient is constrained, and why it is not a constant here
# ------------------------------------------------------------------
# The other send workflows pin the recipient as a literal in a public file, so
# that any change to it shows in a diff. That is the right shape for a letter to
# a chosen stranger. It is the wrong shape here, for two reasons: publishing my
# operator's personal address is a harm nobody asked for, and a constant I can
# edit is *visible*, not *prevented*.
#
# So the recipient of this workflow is `secrets.MAIL_REPLY_TO` — an address the
# operator set and I cannot read.
#
#   I cannot aim this workflow. There is no input, no constant, and no value I
#   can see. It goes to her inbox or it goes nowhere.
#
# For this one purpose that is a stronger constraint than a public constant.
#
# What still cannot happen
# ------------------------
#   * GET/POST elsewhere: no. One provider call, to send one message.
#   * A different recipient: there is no way to express one.
#   * A different body: `mail/wiring-check.txt` is committed and public.
#   * Twice: if `audit/external.jsonl` records a send for C-0027, it refuses.
#   * Before my operator has decided: see the next paragraph.
#
# The promise, made mechanical
# ----------------------------
# C-0027 says, in my own words: I will not dispatch until the "it is ready" line
# comes back in the ledger. Five of the first seven decisions in this project
# arrived only as speech inside a session and left no trace in the append-only
# ledger; a promise I merely remember is one that a later session, with no
# memory of making it, can keep by accident at best. So this workflow reads
# `audit/claims.jsonl` and refuses unless C-0027 is recorded there as granted.
#
# The gate is not there to doubt my operator. It is there so that the trace,
# rather than my memory, is what lets the send happen.
#
# Session 149: the two sentences above name two different predicates
# -----------------------------------------------------------------
# They were written one after the other in the same session, and they do not
# say the same thing. The promise is about "it is ready" — the wiring exists.
# The gate below tests "granted" — permission was given. Permission arrived on
# 2026-09-30, by speech. Readiness is a separate fact, and nothing in the
# ledger reports it.
#
# That mattered, because the session that wrote this file also believed it was
# forbidden from writing decision rows at all — a rule it had in fact repealed
# twenty days earlier, and written seventeen rows against since. So the ledger
# kept saying C-0027 was pending, this gate kept refusing, and the one external
# path whose last step was in my own hands stayed shut for three days on the
# strength of a sentence about myself that was no longer true.
#
# Writing the missing row was owed either way: an append-only ledger that says
# "pending" about something settled is a false record of the past by omission,
# which is the exact argument `verify.py`'s check 5 makes in its own docstring.
# But writing it also opens this gate — and the row is mine, not my operator's.
#
# So two things change here, and one thing does not.
#
#   * The gate now also requires that the granting row NOT be one I recorded
#     myself (`recorded_by` must be absent or anything other than AI). That is
#     a presence test and I could defeat it by typing a different string. It is
#     kept for the same reason check 5 is kept: it makes silence stop working.
#     An unmarked pass is no longer indistinguishable from my operator's own.
#     It reads only the LAST C-0027 row, so a correction row of mine written
#     afterwards closes the gate again. That is the safe direction, and it is
#     worth knowing rather than discovering: once the ready line is in, I should
#     not append further AI rows to C-0027 without expecting to re-ask for it.
#
#   * The claim that this gate runs "on the trace, not on memory" is narrowed.
#     It was true only while I believed I could not write decision rows. I can.
#     No gate inside a repository I push to can tell my row from my operator's.
#
#   * What does not change, and never depended on any of this: THE SECRETS ARE
#     THE REAL GATE. If the `send-mail` environment does not exist, or does not
#     carry MAIL_REPLY_TO, `send_one_email.py` dies and nothing leaves. I cannot
#     read those values, cannot write them, and cannot route around them. The
#     unforgeable readiness check was always in the runner, never in the ledger.
#
# I am also not dispatching this on the strength of my own row. In
# `あやがやること.md` — the page my operator actually reads — session 145b
# promised her, in writing, that this would not fire until her "it is ready"
# line came back. The gate below would now let me through. The promise does
# not, and the promise is the stricter of the two.

name: wiring check — one message to the operator (C-0027)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type WIRING to confirm (there are no other inputs; recipient is a secret, body is a committed file)'
        required: true

env:
  BODY_FILE: mail/wiring-check.txt
  CLAIM: C-0027
  MAIL_FROM_NAME: n0 autonomous agent

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    environment: send-mail
    steps:
      - uses: actions/checkout@v4

      - name: Refuse unless confirmed
        run: |
          [ "${{ inputs.confirm }}" = "WIRING" ] || {
            echo "not confirmed; nothing sent" >&2; exit 1; }

      - name: Refuse unless the ledger records C-0027 as granted by someone other than me
        run: |
          if ! python3 - <<'PY'
          import json, sys
          state = None
          by = None
          for line in open("audit/claims.jsonl", encoding="utf-8"):
              line = line.strip()
              if not line:
                  continue
              row = json.loads(line)
              if row.get("claim_id") == "C-0027":
                  state = row.get("status")
                  by = row.get("recorded_by")
          print("audit/claims.jsonl says C-0027 is: %r (recorded_by %r)" % (state, by))
          # Session 149 added the second condition. The first row to grant C-0027 in
          # the ledger is one I wrote myself, from speech, because leaving the field
          # empty was a false record by omission. It was owed. It is not my
          # operator's "it is ready" line, and this step must not treat it as one.
          mine = (by or "").strip().upper().startswith("AI")
          if state == "可" and mine:
              print("...but that row is one I recorded myself. That is permission, "
                    "not readiness, and not the line this workflow waits for.")
          sys.exit(0 if (state == "可" and not mine) else 1)
          PY
          then
            echo "C-0027 is not recorded as granted by anyone but me." >&2
            echo "The approval may well have been spoken in a session; five of the first" >&2
            echo "seven decisions in this project arrived that way and left no row." >&2
            echo "Writing that row down is owed — an append-only ledger saying 'pending'" >&2
            echo "about a settled thing is a false record by omission. But my own row is" >&2
            echo "permission, not readiness, and the promise in あやがやること.md waits on" >&2
            echo "readiness. The secrets are the gate that cannot be argued with: without" >&2
            echo "MAIL_REPLY_TO nothing leaves this runner at all. Nothing sent." >&2
            exit 1
          fi

      - name: Refuse if this claim has already been sent
        run: |
          if grep -q '"claim_id": *"'"$CLAIM"'"' audit/external.jsonl; then
            echo "audit/external.jsonl already records a send for $CLAIM." >&2
            echo "One wiring check is enough. Nothing sent." >&2
            exit 1
          fi
          echo "no prior send recorded for $CLAIM"

      - name: Show exactly what will be sent
        run: |
          echo "to      : (the MAIL_REPLY_TO secret — masked here, and unreadable to me)"
          echo "body    : $BODY_FILE"
          echo "--------------------------------------------------------"
          cat "$BODY_FILE"
          echo "--------------------------------------------------------"

      - name: Send it
        env:
          TO: ${{ secrets.MAIL_REPLY_TO }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
        run: python3 .github/send_one_email.py
