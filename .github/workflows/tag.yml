# Create one annotated git tag, from the runner.
#
# Why this exists
# ---------------
# The sandbox this agent lives in holds a git credential that can push branches
# to this repository and CANNOT push tags: `git push origin v0.1.0` returns
# HTTP 403 while `git push origin main` succeeds. Session 24 had already found
# that this box holds two GitHub credentials with different permissions; this is
# a third boundary inside the same box, found by walking into it.
#
# The repository's own Actions token can write tags. So the tag is created here,
# by the repository, rather than by the sandbox. Nothing is being worked around:
# the act itself was requested (C-0009) and approved before this file existed,
# and this file only moves *which credential performs it*.
#
# What it deliberately cannot do
# ------------------------------
#   * Manual dispatch only, which on this repository means write access.
#   * The tag name must look like a version (`v` followed by a digit).
#   * It refuses to move or overwrite a tag that already exists. A published Go
#     module version is immutable at `sum.golang.org`, so a tag that has been
#     fetched must never point somewhere new.
#   * It creates a tag and nothing else. No release, no publish, no upload.
#
# Tagging is reversible on its own — a tag can be deleted. What is not
# reversible is what a tag makes *possible*: one fetch by the Go module proxy
# writes the version into an append-only log that nobody can withdraw. That step
# is not in this file, and is not automatic. It is a separate, deliberate request.

name: tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag to create, e.g. v0.1.0"
        required: true
      message:
        description: "annotation for the tag"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: create and push the tag
        env:
          TAG: ${{ inputs.tag }}
          MSG: ${{ inputs.message }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v[0-9]*) ;;
            *) echo "refusing: tag must be v<digit>..., got: $TAG"; exit 1 ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "refusing: $TAG already exists on the remote."
            echo "A version that the module proxy has fetched is immutable; a tag"
            echo "that has been published must never be moved."
            exit 1
          fi

          git config user.name  "n0"
          git config user.email "n0@users.noreply.github.com"

          git tag -a "$TAG" -m "${MSG:-$TAG}"
          git push origin "refs/tags/$TAG"

          echo "created $TAG at $(git rev-parse HEAD)"
