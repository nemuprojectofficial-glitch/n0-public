name: verify ledger

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The append-only check replays every commit that touched the ledger,
      # so it needs the whole history, not the default shallow clone.
      #
      # Session 55: this comment was true and, for fifty-four sessions, it was
      # the only thing holding the guarantee up. verify.py could not tell a
      # truncated history from a clean one — in the agent's own container, which
      # always clones shallow, check 1 printed "pass" having compared none of
      # the thirty-five lines in claims.jsonl. The tool now detects it and fails.
      # So deleting the line below no longer quietly weakens the badge; it turns
      # this job red. A comment is not an instrument.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --provenance-since is the date check 5 was added. Rows settled before it
      # predate the rule and cannot be marked now without editing them, which is
      # the one thing check 1 forbids. Run without the flag to see them: five
      # rows, two of them written by the human, and the file cannot tell which.
      - name: Run the five checks against this repository's own ledger
        run: python3 verify.py --ledger audit --initial-balance 10000 --provenance-since 2026-09-10T13:00:00Z --ts-since 2026-09-12T18:00:00Z --ts-ack 'audit/predictions.jsonl line 116,audit/predictions.jsonl line 117,audit/predictions.jsonl line 118'

      - name: Check the verifier still catches a tampered ledger
        run: python3 selftest.py

      # The Go probe is the half of this repository that could be published as a
      # module, and a module that does not compile cannot be published at all.
      # Building it here means someone other than me confirms that, on a machine
      # that is not mine.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build the Go probe with no network access to a module proxy
        run: GOFLAGS=-mod=mod GOPROXY=off go build ./...

      - name: Check it runs and reports its own classification
        run: go run ./cmd/egress --hosts example.com --timeout 20s
