[build-system]
requires = ["setuptools>=77"]  # PEP 639 の license = "MIT" / license-files に要る（セッション30）
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit-ledger"
version = "0.1.0"
description = "Dependency-free tools for an AI agent that keeps records about itself: an append-only ledger verifier, a sandbox egress prober, and an approval-effect checker."
readme = "PYPI.md"
requires-python = ">=3.8"
authors = [{ name = "n0", email = "noreply@anthropic.com" }]

# C-0004 が 2026-09-11（セッション30）に可。提出から約100時間。
# ライセンスはあやの名義で第三者に権利を許諾する行為なので、私の判断では付けられなかった。
license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "agent", "ai-agent", "llm-agent", "autonomous-agent",
    "audit", "audit-log", "append-only", "ledger", "tamper-evident",
    "provenance", "accountability", "agent-safety",
    "sandbox", "egress", "allowlist", "network-policy",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/nemuprojectofficial-glitch/n0-public"
Specification = "https://github.com/nemuprojectofficial-glitch/n0-public/blob/main/SPEC.md"
"Egress measurement" = "https://github.com/nemuprojectofficial-glitch/n0-public/blob/main/EGRESS.md"
Issues = "https://github.com/nemuprojectofficial-glitch/n0-public/issues"

[project.scripts]
agent-audit-verify = "verify:main"
agent-egress-probe = "egress_probe:main"
agent-claim-effect = "claim_effect:main"
# セッション45（custody_probe）と セッション46（reach_probe / release_freeze）。
# 3本とも読み取り専用——custody と reach は GET のみで資格情報を送らず、
# release_freeze は台帳を読むだけで何も書かない。
# ★ 版はまだ上げない。P-0025 が「公開しないこと」を条件に測定中で、
#    publish-pypi.yml が release_freeze.py で止まる（2026-09-19 まで）。
agent-custody-probe = "custody_probe:main"
agent-reach-probe = "reach_probe:main"
agent-release-freeze = "release_freeze:main"
# セッション47。reach_probe が返す数に、比較対象を付ける。
# 同じ日に PyPI へ初めて上がった全プロジェクトを母集団にして、1件を目盛りの上に置く。
# これも読み取り専用（GET のみ・資格情報なし・本文なし）。
agent-cohort-probe = "cohort_probe:main"

# フラット配置。ファイルは動かさない。
# README と CI が `python3 verify.py` で呼んでおり、移動すると両方が壊れる。
[tool.setuptools]
py-modules = ["verify", "egress_probe", "claim_effect", "selftest",
              "custody_probe", "reach_probe", "release_freeze", "cohort_probe"]

[tool.setuptools.package-data]
"*" = ["SPEC.md", "EGRESS.md"]
